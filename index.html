    <meta name="description" content="Data journalist and visual storyteller" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/global.css" as="style" />
    <link rel="stylesheet" href="/global.css" />

    <!--
      Paint the background colour instantly — before any external CSS loads.
    -->
    <meta name="theme-color" content="#000023" />

    <!--
      Preload the first hero image (above the fold) so the fetch starts in
      parallel with JS parsing, not after Svelte mounts.
    -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/bbo-ev-energy-livermore-320.webp"
      media="(max-width: 520px)"
      type="image/webp"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/images/bbo-ev-energy-livermore-680.webp"
      media="(min-width: 521px)"
      type="image/webp"
    />

    <!--
      DNS prefetch for font origins so the TCP handshake is already done
      by the time the browser parses the stylesheet.
    -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!--
      preconnect for the actual font file origin (gstatic).
      googleapis serves the CSS redirect, gstatic serves the files.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Load fonts non-blocking via the print-media trick:
        1. Browser fetches the stylesheet without blocking rendering (media="print").
        2. Once loaded, onload flips it to media="all" so it applies.
        3. <noscript> provides a synchronous fallback for no-JS environments.
    -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Doto:wght,ROND@700,100&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;500;700&family=Doto:wght,ROND@700,100&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Doto:wght,ROND@700,100&display=swap"
        rel="stylesheet"
      />
    </noscript>
